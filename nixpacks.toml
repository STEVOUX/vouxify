# nixpacks.toml — Railway build config for VOUXIFY
# Installs Node.js + FFmpeg + yt-dlp in the Railway environment

[phases.setup]
nixPkgs = ["ffmpeg", "python312", "nodejs_20"]

[phases.install]
cmds = [
  "npm ci",
  "pip install yt-dlp --break-system-packages"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm run start"
